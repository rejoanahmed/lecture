<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎯 Number Guessing Game</h1>
        <p>I'm thinking of a number between 1 and 100. Can you guess it?</p>
        
        <div class="game-area">
            <div class="input-section">
                <input type="number" id="guessInput" placeholder="Enter your guess (1-100)" min="1" max="100">
                <button id="guessButton">Guess!</button>
            </div>
            
            <div class="feedback" id="feedback">
                <p>Take a guess!</p>
            </div>
            
            <div class="game-info">
                <p>Guesses remaining: <span id="guessesLeft">10</span></p>
                <p>Previous guesses: <span id="previousGuesses"></span></p>
            </div>
            
            <div class="buttons">
                <button id="newGameButton" style="display: none;">New Game</button>
                <button id="hintButton">Get Hint</button>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
