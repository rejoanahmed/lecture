<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Pendulum Simulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Double Pendulum Simulation</h1>
        <div class="controls">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pause</button>
            <button id="resetBtn">Reset</button>
        </div>
        <canvas id="pendulumCanvas" width="800" height="600"></canvas>
        <div class="info">
            <p>Click "Start" to begin the simulation. The double pendulum shows chaotic motion!</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
